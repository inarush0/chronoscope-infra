# The dataset is a static SQLite file built by scripts/build-db.ts, so the
# stack is a single service. Mount the file locally, or unset DATABASE_FILE and
# set DATABASE_URL to fetch it from object storage instead.
services:
  app:
    build:
      context: ../chronoscope
      dockerfile: Dockerfile
    environment:
      DATABASE_FILE: /data/chronoscope.sqlite
      ORIGIN: http://localhost:3000
      DEFAULT_DATASET: ${DEFAULT_DATASET:-bible}
      # Pick up `bun run build-db` without restarting. Leave unset in production.
      DATASET_RELOAD: ${DATASET_RELOAD:-1}
    volumes:
      # Mount the directory, not the file: build-db replaces the .sqlite, and a
      # single-file bind mount would pin the old inode inside the container.
      - ./data:/data:ro
    ports:
      - "3000:3000"
